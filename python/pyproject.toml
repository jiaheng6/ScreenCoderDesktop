[project]
name = "screencoder-worker"
version = "0.1.0"
description = "Python worker for ScreenCoderDesktop"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "opencv-python-headless>=4.8.0",
  "pillow>=10.0.0",
  "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
